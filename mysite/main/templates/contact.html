{%extends 'base.html'%}
{%block main%}
<div class="container">
    <div class="row" >
        <h1>Užklausos forma</h1></div>
    <div class="row" >
    <form method="post" action='/contact/' class="needs-validation">
    {% csrf_token %}

    <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">Vardas, Pavardė</label>

        <input type="text" name="name" class="form-control {% if form.name.errors %}is-invalid{% endif %}" id="{{ form.name.id_for_label }}"  required>
        <div class="invalid-feedback">
            {% if form.name.errors %}
                {% for error in form.name.errors %}
                    {{ error }}
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <div class="mb-3">
        <label for="{{ form.email.id_for_label }}" class="form-label">El.paštas</label>
        <input type="email" name="email" id="{{ form.email.id_for_label }}" class="form-control" required>
        <div class="invalid-feedback">
            {% if form.email.errors %}
                {% for error in form.email.errors %}
                    {{ error }}
                {% endfor %}
            {% endif %}
        </div>
    </div>
{%endblock main%}
