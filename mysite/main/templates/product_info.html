{% extends 'base.html' %}
{% load static %}

{% block main %}

   <div class="container">
    <div class="row">
        <div class="col-4">
                    <img class="card-img-top" src="{{ obj.image }}" alt="" border="1px">
            </div>
        <div class="col-2"></div>
            <div class="col-4">
                <div class="row">
                    <p>{{obj.categoryPath}}</p>
                    <h3 class="title">{{ obj.Name }}</h3>
                </div>
                <div class="row">
                        <h5>Vartotojų įvertinimas: {{obj.review}}</h5>
                    </div>
                <br>
                    <div class="row">
                        <h3 style="font-weight: bold">Kaina: {{ obj.Sales }} €</h3>
                    </div>
                f<div class="row">
                        <a href="{{obj.linkas}}" class="btn btn-warning">Pirkti</a>
                    </div>
                </div>
            </div>
   </div>
{% endblock main %}
